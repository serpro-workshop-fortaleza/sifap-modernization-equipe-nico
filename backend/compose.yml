# PostgreSQL 16 para desenvolvimento. Os testes usam Testcontainers com a mesma imagem.
services:
  postgres:
    image: postgres:16
    container_name: sifap-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sifap
      POSTGRES_USER: sifap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no ambiente}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifap -d sifap"]
      interval: 5s
      timeout: 5s
      retries: 10
